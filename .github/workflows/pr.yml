# Every pull request to main: type check, tests and the app build on Windows, Linux and macOS.
# Actions are pinned to exact versions, each at least 14 days old when pinned (docs/dev/security.md);
# Dependabot proposes newer ones after the same wait (.github/dependabot.yml).
name: PR build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      # .npmrc: no install scripts, exact versions from the lockfile.
      - run: npm ci
      - run: npm audit signatures
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:app
