# A release, started by hand by a maintainer on main (Actions → Release → Run workflow), never by a tag or a merge.
# Two approvals: before the first nothing is built or uploaded (only the plan, the checks and a preview); before the
# second nothing is published (the installers are built and checked, the signing key is not used yet).
#
#   1. plan:    the version from the inputs (or the package.json), what changes for it (scripts/release/plan.mjs:
#               the version in every package.json, CHANGELOG "Unreleased" → the version, news/next.* → the
#               version), the type check and the tests, and a preview in the run's summary. When something
#               changes, a release commit on the branch release/v<version>. Stops unless both environments,
#               "approval" and "release", have required reviewers.
#   2. approve: the first approval (environment "approval"): build the installers.
#   3. build:   the installers on Windows, Linux and macOS from exactly the planned commit, each tested as a user
#               gets it. Official builds name this repository for updates.
#   4. attest:  build provenance for every installer (gh attestation verify), in a job that runs no npm code.
#   5. publish: the second approval (environment "release", which holds the signing key RELEASE_SIGNING_KEY):
#               each installer from the build of its own system, checked against that build's checksums and its
#               provenance; one SHA256SUMS.txt, signed with the project's key (scripts/release/sign.mjs; the app
#               takes no update without it), and the release with its tag v<version>. A release commit reaches main
#               by a pull request (main's ruleset); the summary says how.
#   6. announce: the English news on Discord (scripts/release/announce.mjs, the repository secret DISCORD_WEBHOOK_URL), up
#               to three tries. The release is out by then: a failure here is only a warning, and the run stays green.
#
# Repository settings this relies on (docs/dev/building.md, "CI"): the environments "approval" and "release", both
# with required reviewers and the deployment branch main, "release" with the secret; immutable releases; the rulesets
# for main and tags v*.
# Actions are pinned to exact versions, each at least 14 days old when pinned (docs/dev/security.md). No package
# cache: every install comes from the registry, and no other run can leave one behind for a release.
name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel: alpha and beta are pre-releases (1.2.0-beta), full is a release (1.2.0)'
        type: choice
        options: [beta, alpha, full]
        default: beta
      bump:
        description: 'Version bump (ignored when a version is given): none = the package.json version, pre = 1.0.0-beta → 1.0.0-beta.2'
        type: choice
        options: [none, pre, patch, minor, major]
        default: none
      version:
        description: 'Exact version instead (e.g. 1.0.0-beta.2); empty = from the bump'
        required: false
        default: ''

permissions:
  contents: read

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    # Only main: another branch would bring its own workflow and scripts.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: The approvals must be set up
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Without required reviewers GitHub would create an environment on the fly, and nothing would wait.
          for environment in approval release; do
            reviewers="$(gh api "repos/$GH_REPO/environments/$environment" --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' 2>/dev/null || echo 0)"
            if [ "$reviewers" -lt 1 ]; then
              echo "::error::The environment \"$environment\" needs required reviewers (Settings → Environments)."; exit 1
            fi
          done
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci
      - name: Plan the version
        id: plan
        env:
          CHANNEL: ${{ inputs.channel }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: node scripts/release/plan.mjs --apply "--channel=$CHANNEL" "--bump=$BUMP" "--version=$VERSION"
      - name: The tag must be new
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION exists already."; exit 1
          fi
      - name: Check
        run: |
          npm audit signatures
          npm run typecheck
          npm test
      - name: Release commit (only when something changed)
        id: commit
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          CHANGED: ${{ steps.plan.outputs.changed }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Only what the plan changed: the versions, CHANGELOG.md and the news (release/ is ignored).
            git add -A
            git commit -m "Release v$VERSION"
            git push origin "HEAD:refs/heads/release/v$VERSION"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Preview
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          {
            echo "## Release preview: v$VERSION"
            echo
            echo "- Pre-release: $PRERELEASE"
            echo "- Commit: $(git rev-parse --short HEAD) ($(git log -1 --format=%s))"
            echo "- Type check and tests passed. Nothing is built or uploaded before the first approval (environment \"approval\"), nothing is published before the second (environment \"release\")."
            echo
            echo "### Notes"
            echo
            cat release/notes.md
            for lang in en de; do
              echo
              echo "### News ($lang)"
              echo
              cat "apps/ui/public/news/$VERSION.$lang.md"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      # The notes for the release page (text only).
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-notes
          path: release/notes.md
          retention-days: 1

  approve:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The first approval: required reviewers on this environment. Nothing else happens here.
    environment: approval
    steps:
      - env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: echo "v$VERSION approved."

  build:
    needs: [plan, approve]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci
      - if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: Installers
        env:
          # The app looks for updates in this repository's releases (apps/desktop/src/updates.ts).
          GTT_UPDATE_REPO: ${{ github.repository }}
        run: node scripts/release/release.mjs --skip=mac-package
      # Only for the next jobs of this run, kept for one day; the release is the download.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: installers-${{ matrix.name }}
          path: |
            release/*/*.exe
            release/*/*.deb
            release/*/*.dmg
            release/*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  attest:
    # Apart from the builds: no npm code runs where the provenance can be signed.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: installers-*
          path: artifacts
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            artifacts/installers-windows/**/*.exe
            artifacts/installers-linux/**/*.deb
            artifacts/installers-mac/**/*.dmg

  publish:
    needs: [plan, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The second approval, right before anything becomes public; this environment also holds the signing key.
    environment: release
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
      - name: Collect and check the installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir upload
          # Each installer from the build of its own system, exactly the expected ones, against that build's
          # checksums and its provenance.
          take() {
            local system="$1" name="$2"
            mapfile -t found < <(find "artifacts/installers-$system" -type f -name "$name")
            [ "${#found[@]}" -eq 1 ] || { echo "::error::$name not (or more than once) in the $system build"; exit 1; }
            (cd "$(dirname "${found[0]}")" && grep -E "  $name\$" SHA256SUMS.txt | sha256sum -c -)
            gh attestation verify "${found[0]}" --repo "$GH_REPO"
            cp "${found[0]}" upload/
          }
          take windows "GT-Toolz-Setup-$VERSION-x64.exe"
          take linux "gt-toolz_${VERSION}_amd64.deb"
          take mac "GT-Toolz-$VERSION-mac-arm64.dmg"
          take mac "GT-Toolz-$VERSION-mac-x64.dmg"
          (cd upload && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Sign the checksum list
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node scripts/release/sign.mjs upload/SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          # Every file first (as a draft, for a moment), then published at once: a published release cannot change.
          flags=(--draft --title "GT Toolz $VERSION" --notes-file artifacts/release-notes/notes.md --target "$SHA")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "v$VERSION" "${flags[@]}" upload/*
          gh release edit "v$VERSION" --draft=false
          echo "Published: $(gh release view "v$VERSION" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
          # main changes only by pull request (its ruleset): a release commit comes to main by one, merged as a merge
          # commit so that the tag stays in main's history.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$SHA" ]; then
            {
              echo
              echo "**Next:** open a pull request from \`release/v$VERSION\` to \`main\` and merge it with a merge commit, so that main carries the version:"
              echo
              echo "\`gh pr create --repo $GH_REPO --base main --head release/v$VERSION --title \"Release v$VERSION\" --body \"Version, changelog and news of v$VERSION.\"\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  announce:
    # Only once the release is public, with no npm code and no write access. Whatever happens here, the run stays green.
    needs: [plan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Announce on Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release/announce.mjs "--version=$VERSION"
