# Every push to main: the installers of all three systems, each tested the way a user gets it (installed, started
# with --self-test, uninstalled). They stay as artifacts of the run for 14 days; nothing is published, and these
# builds never look for updates (only the release workflow names the repository for that).
name: Build (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.2
      - run: npm ci
      # The installer test starts the app; Linux runners have no display.
      - if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - run: node scripts/release/release.mjs --skip=mac-package
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gt-toolz-${{ matrix.name }}
          path: |
            release/*/*.exe
            release/*/*.deb
            release/*/*.dmg
            release/*/SHA256SUMS.txt
            release/test/*.json
          if-no-files-found: warn
          retention-days: 14
