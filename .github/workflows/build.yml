# Every push to main: the type check, the tests and the app build on Windows, Linux and macOS. No installers and no
# uploads: installers are made only by the release workflow, after the approval (release.yml).
# Actions are pinned to exact versions, each at least 14 days old when pinned (docs/dev/security.md).
name: Build (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      # .npmrc: no install scripts, exact versions from the lockfile.
      - run: npm ci
      - run: npm audit signatures
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:app
