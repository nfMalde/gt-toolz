# The Contributor License Agreement (CLA.md): every contributor signs it once with a comment on their pull request;
# the signatures are kept on the branch cla-signatures. Runs on pull_request_target without checking out the pull
# request's code, so nothing of it runs here. The action needs to write: contents for the signatures, actions to run
# the check again after signing. What a write token could do to releases is limited elsewhere: published releases
# are immutable, and the app takes no update whose checksum list is not signed with the project's key, which only
# the approved release job has (docs/dev/security.md).
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: nfMalde,dependabot[bot],github-actions[bot]
